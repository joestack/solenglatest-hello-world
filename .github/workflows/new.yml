name: JFrog AppTrust Scoped Governance Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  apptrust-joern-scope:
    runs-on: ubuntu-latest
  
    permissions:
      actions: read           # for detecting the Github Actions environment
      id-token: write         # for creating OIDC tokens for signing
      packages: write         # for uploading attestations
      contents: read          # read the contents permission
      security-events: write  # for uploading code scanning
      attestations: write     # Required for attestation


    # permissions:
    #   id-token: write    
    #   contents: read     

    env:
      PROJECT_KEY: "joern"
      JF_PROJECT: "joern"                
      APP_KEY: "joern"
      VERSION: "2.0.${{ github.run_number }}"
      JF_URL: https://solenglatest.jfrog.io
      BUILD_NAME: "solenglatest-hello-world-build" 
      JFROG_CLI_LOG_LEVEL: DEBUG

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_ACCESS_TOKEN: ${{ secrets.JF_TOKEN }}
        # with:
        #     oidc-provider-name: joern-github 
        #     version: 2.91.0

      # Step 1: Build application and generate the physical CycloneDX file
      - name: Build & Generate CycloneDX SBOM
        run: |
          mkdir -p output 
          echo "secure-binary" > output/app.bin
          
          echo "Generating CycloneDX SBOM..."
          echo '{"bomFormat": "CycloneDX", "specVersion": "1.6", "components": []}' > output/sbom.json

      - name: Inspect token claims
        run: |
          TOKEN=$(jf c export setup-jfrog-cli-server | base64 -d | jq -r '.accessToken')
          # Decode the JWT payload (middle segment, base64url)
          PAYLOAD=$(echo -n "$TOKEN" | cut -d. -f2)
          # pad to multiple of 4 for base64
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq .

      - name: Diagnose AppTrust access
        run: |
          # Pull the OIDC-exchanged access token out of the CLI's server config
          TOKEN=$(jf c export setup-jfrog-cli-server | base64 -d | jq -r '.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Couldn't extract token; dumping config keys for debugging:"
            jf c export setup-jfrog-cli-server | base64 -d | jq 'keys'
            exit 1
          fi
          echo "=== AppTrust app lookup (joern) ==="
          curl -sS -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            "${JF_URL}/apptrust/api/v1/applications/joern"
          echo
          echo "=== AppTrust apps list (project=joern) ==="
          curl -sS -w "\nHTTP %{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" \
            "${JF_URL}/apptrust/api/v1/applications?project_key=joern"


      # Step 2: Upload Application Binary to Artifactory & Publish Build Info
      - name: Publish Build to JFrog
        run: |
          # Upload binary to your validated repository
          jf rt upload "output/app.bin" "joern-hello-world/apps/" \
            --build-name="${{ env.BUILD_NAME }}" \
            --build-number="${{ github.run_number }}" \
            --project="${{ env.PROJECT_KEY }}"
          #
          #
          jf apptrust package-bind "joern" "generic" "app.bin" "${{ github.run_number }}"


          # FIXED: Swapped namespace to 'jf rt build-publish'
          jf rt build-publish "${{ env.BUILD_NAME }}" "${{ github.run_number }}" \
            --project="${{ env.PROJECT_KEY }}"

      # Step 3: Register the Application Version inside AppTrust
      - name: Create AppTrust Application Version
        run: |
          jf apptrust version-create ${{ env.APP_KEY }} ${{ env.VERSION }} \
            --tag="dev" \
            --source-type-builds="name=${{ env.BUILD_NAME }},id=${{ github.run_number }}"

      # Step 4: Sign and attach the CycloneDX SBOM as Evidence
      - name: Attach SBOM Evidence to Project
        run: |
          jf apptrust evidence-create \
            --project="${{ env.PROJECT_KEY }}" \
            --app-key="${{ env.APP_KEY }}" \
            --version="${{ env.VERSION }}" \
            --file="output/sbom.json" \
            --predicate-type="https://jfrog.com/evidence/cyclonedx/sbom/v1.6" \
            --slug="cyclonedx-sbom"